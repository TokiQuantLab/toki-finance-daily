[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toki-finance-daily"
version = "0.1.0"
description = "AI financial daily briefings with Agent Skills and Python: news, economic calendars, market analysis, posters and a research website"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "TokiQuantLab"}]
keywords = ["finance", "financial-news", "agent-skills", "ai-agents", "economic-calendar", "market-analysis", "technical-analysis"]
dependencies = []

[project.urls]
Repository = "https://github.com/TokiQuantLab/toki-finance-daily"
Documentation = "https://github.com/TokiQuantLab/toki-finance-daily/blob/main/README.md"

[project.optional-dependencies]
poster = ["playwright>=1.50,<2"]

[project.scripts]
toki-daily = "toki_finance_daily.cli:main"

[tool.setuptools.packages.find]
include = ["toki_finance_daily*"]

[tool.setuptools.package-data]
toki_finance_daily = ["assets/*"]
