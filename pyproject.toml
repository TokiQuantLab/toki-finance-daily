[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toki-finance-daily"
version = "0.1.0"
description = "Evidence-first financial daily posters, powered by code and an editorial AI skill"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Toki Quant Lab"}]
dependencies = []

[project.optional-dependencies]
poster = ["playwright>=1.50,<2"]

[project.scripts]
toki-daily = "toki_finance_daily.cli:main"

[tool.setuptools.packages.find]
include = ["toki_finance_daily*"]

[tool.setuptools.package-data]
toki_finance_daily = ["assets/*"]
